databases:
  - name: medisentinel-db
    databaseName: medisentinel
    user: medisentinel_user
    plan: free

services:
  # Backend API Service
  - type: web
    name: medisentinel-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medisentinel-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

  # Frontend Static Site
  - type: staticSite
    name: medisentinel-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    plan: free
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
